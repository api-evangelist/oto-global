aid: oto-global
name: OTO Global
description: >-
  OTO is a multi-carrier shipping and fulfillment platform for e-commerce businesses,
  headquartered in Saudi Arabia and serving 10,000+ merchants. It connects a single
  integration to 450+ shipping carriers and provides order management, warehouse and
  picking/packing automation, real-time tracking with customer notifications, returns
  management, address validation, and omnichannel order synchronization. The OTO REST
  API V2 (base https://api.tryoto.com/rest/v2, staging at staging-api.tryoto.com) exposes
  74 operations across orders, shipments, returns, tracking, shipping rates, carrier
  integrations, pickup locations, products, stock management, sales channels, and
  webhooks. Authentication is a bearer access_token minted from a dashboard refresh_token.
