      description: 'Check Order Availability This API endpoint allows you to check the availability of
        an order based on the provided orderId and associated ruleIds . Request Parameters Existing Order
        (with OrderID) The user provides an orderId (increment ID) that is already created in OTO. The
        system checks the availability of the order and returns the list of locations where it can be
        fulfilled. By default, the API considers all OMS rules while checking availability. Optionally,
        the user can provide specific OMS '
