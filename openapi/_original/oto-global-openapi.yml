  /rest/v2/updatePackingStatus:
    post:
      operationId: updatePackingStatus
      summary: Update Packing Status
      tags:
      - Stock Management
      description: 'This API endpoint allows you to update the packing status of an order during the fulfillment
        process. This endpoint is used to record and track the progress of orders as they move through
        the packing stage, ensuring accurate status updates for operational visibility. Request Parameters:
        Name Required Type Description orderId yes string Id of the order that you wanna update packing
        status packingStatus yes string Packing status value can be packed or picked'
      requestBody:
        content:
          application/json:
            example:
              orderId: '123'
              packingStatus: packed
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
                message: Successfully updated
  /rest/v2/getPackingOrders:
    post:
      operationId: getPackingOrders
      summary: Get Orders Ready For Packing
