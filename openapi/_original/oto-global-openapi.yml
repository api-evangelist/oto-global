  /rest/v2/checkCoverage:
    post:
      operationId: checkCoverage
      summary: Check Coverage
      tags:
      - Carrier Integrations
      description: 'This API endpoint allows you to verify whether the location provided in your request
        is within the coverage area defined by your OTO settings, including the coverage configurations
        for delivery companies and the branches. Request Parameters: Name Required Type Description city
        yes string City to check coverage lat yes long Latitude lon yes long Longitude pickupLocation
        no boolean If you pass true, it will list the covered and available pickup locations. pickupLocationCode
        no string Lists only th'
      requestBody:
        content:
          application/json:
            example:
              lat: '24.28738403'
              lon: '46.44305038'
              city: Riyadh
            schema:
              type: object
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                branchCoverage: true
                courierDelivery: true
                success: true
                bulletDelivery: true
        '401':
          description: '401'
          content:
            application/json:
              example:
                message: Jwt is expired
                code: 401
        '400':
          description: 400 Bad Request
          content:
            application/json:
              example:
                success: false
                otoErrorCode: OTO1098
                otoErrorMessage: Lat and Lon is missing or invalid
