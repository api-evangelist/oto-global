openapi: 3.0.3
info:
  title: OTO API V2
  version: 2.0.0
  description: 'Introduction OTO REST API provides seamless integration for managing shipments, tracking
    deliveries, and handling logistics operations. With powerful endpoints for creating, updating, and
    querying shipments, it ensures efficient and reliable communication between your systems and OTO''s
    platform. Overview We continuously analyze the e-commerce and logistics industries to enhance shipping
    and fulfillment processes, making them easier for vendors. OTO APIs are designed to automate and simplify
    key logistics operations, including: 🚀 Order Management – Process, update, and sync orders seamlessly.
    🚀 Shipment Management – Create, manage, and track shipments effortlessly. 🚀 Return Management – Handle
    return requests and reverse logistics smoothly. 🚀 Stock Inventory Management – Keep inventory levels
    updated in real-time. 🚀 Product Management – Organize, update, and synchronize products efficiently.
    🚀 Warehouse Management – Add, update, organize pickup locations. You can find guidance to assist you
    throughout the integration process here . Base URL: All API requests must be made over HTTPS to the
    following base endpoint: https://api.tryoto.com Meet our new OTO AI Assistant 🤖— a smart AI agent
    designed to help you navigate and use our REST API with ease. Whether you''re integrating for the
    first time or need help troubleshooting a request, our assistant is here to provide instant answers,
    example json responses, guide you through endpoints, and help you build faster.'
  contact:
    name: OTO Support
    url: https://help.tryoto.com/en/support/home
  x-source: derived from published OTO API V2 Postman collection (apis.tryoto.com)
servers:
- url: https://api.tryoto.com/rest/v2
  description: Production
- url: https://staging-api.tryoto.com/rest/v2
  description: Staging / sandbox
tags:
- name: Plan-Based API Access
  description: API functionality is structured across subscription tiers, where basic operations are available
    in lower plans and advanced features, integrations, and system modules are unlocked in higher tiers.
    Below you can find the OTO API access plan. Endpoint Free Plan Starter Plan Scale Plan Pro Plan Enterpr
- name: Release Notes
  description: 'April 2026 Release Notes 🚀 Enhancement: Feasibility-Based Shipping Option Filtering We
    are introducing a new optional request parameter that enables clients to control whether feasibility
    rules should be applied before returning shipping options. This enhancement is available for the following
    endpo'
- name: Sandbox Account
  description: 'Use the sandbox environment to create and test new configurations without affecting your
    live data. This helps you validate changes safely before deployment. Dev URL: https://staging-api.tryoto.com
    Please watch the guide to create a test account.'
- name: Use Cases and Flows
  description: ''
