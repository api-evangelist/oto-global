      description: 'This API initiates the cancellation process with the shipping company. Shipments cannot
        be canceled once they have reached the " picked up " status. Some shipping companies do not support
        shipment cancellations, which may result in a failure response indicating the shipment could not
        be canceled. Request Parameters: Name Required Type Description orderId yes( if there is no otoId)
        string orderId from which shipment was created otoId yes( if there is no orderId) string Unique
        id created by OTO. s'
