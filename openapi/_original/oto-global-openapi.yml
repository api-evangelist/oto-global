      - Stock Management
      description: 'This API endpoint retrieves a list of orders that are ready for pick and pack operations.
        This endpoint is designed to streamline warehouse workflows by providing access to orders that
        have completed prior processes and are prepared for fulfillment. Request Parameters: Name Required
        Type Description warehouseCode yes String pickupLocationCode of the warehouse.'
