              boxHeight: 10
              orderDate: 30/12/2022 15:45
              deliverySlotDate: 31/12/2022
              deliverySlotTo: 12pm
              deliverySlotFrom: 2:30pm
              customer:
                name: عبدالله الغامدي
                email: test@test.com
                mobile: '546607389'
                address: 6832, Abruq AR Rughamah District, Jeddah 22272 3330, Saudi Arabia
                district: Al Hamra
                city: Riyadh
                country: SA
                postcode: '12345'
                lat: '40.706333'
                lon: '29.888211'
                refID: '1000012'
                W3WAddress: alarmed.cards.stuffy
              items:
              - productId: 112
                name: test product
                price: 100
                quantity: 1
                sku: test-product
                image: http://....
              - name: test product 2
                price: 100
                quantity: 1
                sku: test-product-2
                image: http://....
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
                message: Successfully updated
  /rest/v2/updateOrderStatus:
    post:
      operationId: updateOrderStatus
      summary: Update Order Status
      tags:
      - Orders
      description: 'This API endpoint allows you to modify the current status of an order within the system.
        You can update the order status to "delivered," "returned," if the order does not have an associated
        shipment. For "picked up" there should be an associated shipment. However, if a shipment exists,
        only statuses for integrator-managed shipments can be updated. Request Parameters: Name Required
        Type Description orderIds yes string Id of the order/s status yes string status of the shipment(delivered,
        returned,'
      requestBody:
        content:
          application/json:
            example:
              orderIds:
              - 30846946
              status: delivered
              date: '2024-08-06T21:00:00.000Z'
              description: aaaaaa
            schema:
              type: object
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                result:
                - {}
                - success: true
                  orderIds:
                  - '30846946'
  /rest/v2/cancelOrder:
    post:
      operationId: cancelOrder
      summary: Cancel Order
      tags:
      - Orders
      description: 'This API endpoint allows users to cancel an existing order under specific conditions.
        It ensures smooth and efficient handling of cancellations while maintaining the integrity of related
        processes. Important Note: If the order has an associated shipment, it cannot be canceled via
        this endpoint. Shipment-related restrictions ensure the system prevents conflicts or inconsistencies
        in ongoing fulfillment processes. Request Parameters: Name Required Type Description orderId yes(if
        there is no otoId)'
      requestBody:
        content:
          application/json:
            example:
              orderId: '1234'
            schema:
              type: object
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                success: true
  /rest/v2/orders:
    get:
      operationId: orders
      summary: Get Orders
      tags:
      - Orders
      description: 'This API endpoint is designed to provide a comprehensive overview of orders in your
        system. This endpoint returns detailed information about each order, including pickup locations,
        order IDs, item details, and current statuses. It enables seamless tracking and management of
        orders, ensuring better visibility and control. Request Parameters: Name Required Type Description
        perPage no number Order count in the response. Max limit 100 page no number Pagination number.
