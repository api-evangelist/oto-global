components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Obtain an access_token by POSTing your refresh_token to /refreshToken, then send Authorization:
        Bearer <access_token>.'
security:
- bearerAuth: []
paths:
  /rest/v2/refreshToken:
    post:
      operationId: refreshToken
      summary: Refresh Token
      tags:
      - Authorization
      description: 'This API endpoint is used to obtain a new access_token by providing a valid refresh_token
        . The access_token is a temporary token with a lifespan of one hour, used to authenticate and
        authorize all subsequent API requests. Include the access_token in the request headers as: Authorization:
        Bearer access_token To adhere to security standards, it is recommended to renew the access_token
        periodically (every hour) to maintain uninterrupted access to the API while minimizing security
        risks. This endpo'
      requestBody:
        content:
          application/json:
            example:
              refresh_token: refresh_token
            schema:
              type: object
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                access_token: ey**************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************Tg
                refresh_token: AMf-****************************************************************************************************************************************************************************************************************************************************************************************************************VQ
                success: true
                token_type: Bearer
                expires_in: '3600'
      security: []
  /rest/v2/healthCheck:
    get:
      operationId: healthCheck
      summary: Health Check
      tags:
      - Authorization
      description: This API endpoint is used to check if the system is working properly
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                status: ok
      security: []
  /rest/v2/accountInfo:
    get:
      operationId: accountInfo
      summary: Account Info
      tags:
      - Account
      description: 'This API endpoint retrieves detailed information about the authenticated user''s account.
        This includes general profile details, current subscription and balance of the account. Note:
        You can only see the account information that your token belongs to. Response Body: name: full
        name of the account owner email: email address belong to the account mobileNumber: mobile number
        belong to the account packageName: current subscription package name( scalePackage, enterprisePackage
        etc.) remainingCredit: '
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                remainingCredit: 1578.46
                remainingFreeShipments: '0'
                mobileNumber: '9664564845222'
                accountType: personal
                CRDocStatus: NOT_UPLOADED
                name: testUserEnterprise
                packageName: EnterprisePackage
                email: testEmail_enterprise@tryoto.com
                freelanceDocStatus: INDIVIDUAL
  /rest/v2/buyCredit:
    post:
      operationId: buyCredit
      summary: Buy Credit
      tags:
      - Account
      description: 'Provide amount of credit you wanted to buy, this will response a paymentURL and paymentID
        . Request Parameters: Name Required Type Description amount yes number the amount of credit wanted
        to buy'
      requestBody:
        content:
          application/json:
            example:
              amount: 13.5
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
                paymentID: chg_LV03G2920250933Jk9c2603152
                paymentURL: https://checkout.tap.company/?mode=page&themeMode=&language=en&token=eyJhbGciOiJIUzI1NiJ9.eyJpZCI6IjY3ZTM5ZmI5OGE3Y2NkMWQwZGE1NzlhMSJ9.71AJo8AcbO96of1mbvGLZR7x2cnrcquiwJii0zOGLmE
  /rest/v2/requestMobileVerification:
    post:
      operationId: requestMobileVerification
      summary: Request Mobile Verification
      tags:
      - Account
      description: 'This API endpoint allows you to use a phone number to request a verification token
        (OTP) for account/phone number verification. Marketplaces can also use this endpoint to verify
        their sellers’ phone numbers. Verification can be done in verifyMobileNumber. Request Parameters:
        Name Required Type Description phone yes string Phone number to be verified Response body includes
        success , errorMsg , otoErrorCode , otoErrorMessage when success is false.'
      requestBody:
        content:
          application/json:
            example:
              phone: '+905365042516'
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
                token: fa4f8d03-451c-44f7-9262-10fe193e854d
  /rest/v2/verifyMobileNumber:
    post:
      operationId: verifyMobileNumber
      summary: Verify Mobile Number
      tags:
      - Account
      description: 'This API endpoint verifies a user’s mobile phone number by confirming the one-time
        password (OTP) sent via SMS. The endpoint requires the phone number, the OTP received, and the
        token obtained from the requestMobileVerification step. Once successfully verified, the phone
        number is confirmed for account or seller verification purposes. Request Parameters: Name Required
        Type Description phone yes string The phone number to verify (same as in step 1, in E.164 format).
        code yes string The OTP receiv'
      requestBody:
        content:
          application/json:
            example:
              phone: '+905365042516'
              code: '4739'
              token: fa4f8d03-451c-44f7-9262-10fe193e854d
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
  /rest/v2/getShippingPriceTransactionsList:
    post:
      operationId: getShippingPriceTransactionsList
      summary: Get Shipping Price Transactions List
      tags:
      - Transactions
      description: 'This API endpoint provides details of your Shipping Price Transactions, calculated
        based on your configured shipping price settings. By providing either the Order ID or Shipment
        ID, you can retrieve the shipping cost along with other transactional details. Important Note:
        The results from this API apply only to shipments created using your configured shipping price
        contracts. Shipping costs are calculated based on factors such as weight, destination, and other
        predefined configurations. Request '
      requestBody:
        content:
          application/json:
            example:
              shipmentId: '2302416029'
              orderId: OID-22700-1013
            schema:
              type: object
      responses:
        '200':
          description: 200 Order ID and Shipmetn ID request example
          content:
            application/json:
              example:
                success: true
                count: 1
                shippingTransactions:
                - amount: 11
                  orderID: OID-9618-1062
                  shipmentID: '290615409716'
                  description: shipment created
                  orderStatus: shipmentCreated
                  ID: 1347
                  transactionDate: 2023-12-06T16:18
                  otoOrderID: 30798075
                  deliveryName: smsav2-2
                  transaction: shippingCost
                  status: booked
  /rest/v2/creditTransactions:
    get:
      operationId: creditTransactions
      summary: Credit Transactions
      tags:
      - Transactions
      description: 'This API endpoint provides a powerful way to retrieve credit transaction records from
        your system. This endpoint supports pagination for efficient data retrieval and allows filtering
        based on minimum and maximum dates. Additionally, if an orderId is provided, the maxDate and minDate
        parameters become optional, enabling direct access to transactions associated with the specified
        order. Request Parameters: Name Required Type Description perPage yes number Credit transaction
        count in the response. '
      parameters:
      - name: perPage
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: string
      - name: minDate
        in: query
        required: false
        schema:
          type: string
      - name: maxDate
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                success: true
                transactions:
                - amount: 19
                  orderID: '41590739'
                  deliveryCompanySettingsId: 5564
                  description: Shipment canceled. Delivery fees will be credited back to your account.
                  transactionDate: '2024-09-16T11:26:01'
                  orderPaymentType: cod
                  shipmentType: forward
                  transactionType: dcFee
                  remainingAmount: 85.9
                  deliveryCompanyName: Deliver Now
                  chargingType: charge
                  langKey: dcFeeShipmentCanceledRevokedDescription
                  shipmentID: DNL05000049328
                  ID: 8294185
                  otoOrderID: 10690509
                  status: revoked
                - amount: 18
                  orderID: OID-20980-1092
                  deliveryCompanySettingsId: 5551
                  description: Canceled shipment. Delivery fee credited back to your account.
                  transactionDate: '2024-09-24T10:40:43'
                  orderPaymentType: paid
                  shipmentType: forward
                  transactionType: dcFee
                  remainingAmount: 51.8
                  deliveryCompanyName: Aramex
                  chargingType: refund
                  langKey: dcFeeShipmentCanceledDescription
                  shipmentID: '50162082692'
                  ID: 8430556
                  otoOrderID: 10748485
                  status: canceled
                - amount: 0.9
                  orderID: '1203'
                  deliveryCompanySettingsId: 3022
                  description: OTO Fee Booked on shipment created
                  transactionDate: '2024-09-01T11:37:10'
                  orderPaymentType: cod
                  transactionType: otoFee
                  remainingAmount: 111.2
                  deliveryCompanyName: OTO FLEX
                  langKey: otoFeeSearchingDriverDescription
                  shipmentID: 0e073859
                  ID: 8057956
                  otoOrderID: 10248079
                  status: booked
        '400':
          description: 400 Invalid Date
          content:
            application/json:
              example:
                success: false
                otoErrorCode: '1107'
                otoErrorMessage: minDate or maxDate is missing or invalid
  /rest/v2/shipmentTransactions:
    get:
      operationId: shipmentTransactions
      summary: Shipment Transactions
      tags:
      - Transactions
      description: 'Shipment Transactions This API endpoint provides users with access to detailed information
        about shipment transactions. This API is designed to retrieve and display key transaction data,
        allowing users to monitor and review shipment-related activities.It retrieves shipment transactions
        with the option to paginate and filter by minimum and maximum dates. Note: If orderId exists maxDate
        and minDate are not required. If shipment number exists maxDate and minDate are not required.
        Request Parameters'
      parameters:
      - name: perPage
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: string
      - name: minDate
        in: query
        required: false
        schema:
          type: string
      - name: maxDate
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
                shipments:
                - shipmentNumber: 1231231AS
                  orderId: '123123'
                  shipmentCreationDate: '2023-12-05T06:47:46'
                  deliveryCompanyName: deliveryCompany
                  dcConnectionName: connectionName
                  shipmentType: Forward Shipment
                  dcCharge: 25
                  currency: TRY
                  originalWeight: 100
                  dcUpdatedWeight: 50
                  status: status
                  dcInvoiceNumber: 15579456
                - shipmentNumber: '12435356'
                  orderId: '342324234'
                  shipmentCreationDate: '2023-12-05T06:47:46'
                  deliveryCompanyName: deliveryCompany
                  dcConnectionName: connectionName
                  shipmentType: Forward Shipment
                  dcCharge: 40
                  currency: TRY
                  originalWeight: 40
                  dcUpdatedWeight: 5
                  status: status
                  dcInvoiceNumber: 21626353729823
                - shipmentNumber: '657567'
                  orderId: '34534534'
                  shipmentCreationDate: '2023-12-05T06:47:46'
                  deliveryCompanyName: deliveryCompany
                  dcConnectionName: connectionName
                  shipmentType: Forward Shipment
                  dcCharge: 60
                  currency: TRY
                  originalWeight: 80
                  dcUpdatedWeight: 80
                  status: status
                  dcInvoiceNumber: 21626353729823123213
                - shipmentNumber: '5423423'
                  orderId: '14335213'
                  shipmentCreationDate: '2023-12-05T06:47:46'
                  deliveryCompanyName: deliveryCompany
                  dcConnectionName: connectionName
                  shipmentType: Forward Shipment
                  dcCharge: 25
                  currency: TRY
                  originalWeight: 100
                  dcUpdatedWeight: 50
                  status: status
                  dcInvoiceNumber: 2162635372
  /rest/v2/register:
    post:
      operationId: register
      summary: Register
      tags:
      - Marketplace
      description: 'This API endpoint is just for marketplaces with multiple vendors . Marketplaces can
        register their vendors to OTO with this endpoint. It requires a special kind of token provided
        by OTO. Regular refresh tokens will not work here. If you are a market place you can use register
        endpoint to create an OTO account for your vendors. Request Parameters: Field Name Type Required
        Description country string Yes Country tag (e.g., “TR”, “SA”). city string Yes City tag (must
        match OTO city tags). companyNam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                success: true
                activationLink: https://login.tryoto.com/XYZ
                refreshToken: _refreshToken_
      security: []
  /rest/v2/clientInfo:
    post:
      operationId: clientInfo
      summary: Client Info
      tags:
      - Marketplace
      description: 'This API endpoint is just for marketplaces. Marketplaces can register their vendors
        to OTO with a special kind of token provided by OTO. Regular refresh tokens will not work here.
        If you are a marketplace and used register endpoint to create an OTO account for your vendors
        , you can get the information about the client you have registered. Request Parameters: Name Required
        Type Description email yes string registered email of client'
      requestBody:
        content:
          application/json:
            example:
              email: test30@tryoto.com
            schema:
              type: object
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                userActivated: 'false'
                remainingCredit: 0
                validityDate: 13-October-2028
                success: true
                refreshToken: _refreshToken_
    get:
      operationId: getClientInfo
      summary: Client Info
      tags:
      - Marketplace
      description: 'This API endpoint provides detailed information about a vendor''s account and its
        current status. This endpoint returns essential client-related data, including contact details,
        account balances, and service validity, enabling seamless integration for managing and monitoring
        client activities. Request Parameters: No request body parameters are required for this GET request.
        Response: { "remainingCredit": 10, "phone": "+966567130000", "validityDate": "11-01-2028", "success":
        true, "name": "test Co'
      responses:
        '200':
          description: Client Info
          content:
            application/json:
              example:
                remainingCredit: 10
                phone: '+966567130000'
                validityDate: 11-01-2028
                success: true
                name: test Company
                email: test@example.com
                refreshToken: _refreshToken_
  /rest/v2/createOrder:
    post:
      operationId: createOrder
      summary: Create Order
      tags:
      - Orders
      description: 'This API endpoint is a critical component in e-commerce and logistics systems, enabling
        external applications to initiate and manage new orders seamlessly. This endpoint allows you to
        submit order details, such as customer information, product data, shipping preferences, and payment
        methods. For KSA Shipments: If you are providing the sender and receiver short address codes,
        there is no need to include the city and address information. Note: If you send the createShipment:
        true parameter and the'
      requestBody:
        content:
          application/json:
            example:
              orderId: '1234'
              pickupLocationCode: jdd_wh
              createShipment: 'true'
              deliveryOptionId: 564
              payment_method: paid
              amount: 100
              amount_due: 0
              currency: SAR
              customsValue: '12'
              customsCurrency: USD
              packageCount: 2
              packageWeight: 1
              boxWidth: 10
              boxLength: 10
              boxHeight: 10
              orderDate: 31/12/2022 15:45
              deliverySlotDate: 31/12/2020
              deliverySlotTo: 12pm
              deliverySlotFrom: 2:30pm
              senderName: Sender Company
              customer:
                name: عبدالله الغامدي
                email: test@test.com
                mobile: '546607389'
                address: 6832, Abruq AR Rughamah District, Jeddah 22272 3330, Saudi Arabia
                district: Al Hamra
                city: Jeddah
                country: SA
                postcode: '12345'
                lat: '40.706333'
                lon: '29.888211'
                refID: '1000012'
              items:
              - productId: 112
                name: test product
                price: 100
                rowTotal: 100
                taxAmount: 15
                quantity: 1
                sku: test-product
                image: http://....
              - name: test product 2
                price: 100
                quantity: 1
                sku: test-product-2
            schema:
              type: object
      responses:
        '200':
          description: 200- Sender Information
          content:
            application/json:
              example:
                success: true
                otoId: 540789
        '400':
          description: 400- Split Order Wrong PickupLocationCode
          content:
            application/json:
              example:
                success: false
                warnings:
                - pickupLocation field exists in the items array, split order process begins
                - 'Both the order pickupLocationCode and item''s pickupLocationCode do not exist. Split
                  order process has been revoked '
                otoErrorCode: OTO1071
                otoErrorMessage: Item has pickupLocation array for split order process but the input is
                  invalid in the array.
  /rest/v2/updateOrder:
    post:
      operationId: updateOrder
      summary: Update Order
      tags:
      - Orders
      description: 'This API endpoint allows you update order info with this endpoint before shipment
        creation. If you created a shipment and need to update an information after that you have to cancel
        the shipment first then you can update. Request Parameters: Parameter Required Type Description
        orderId yes string Unique identifier of the Order deliveryOptionId no string Specifies the delivery
        option to be used for the shipment. customer yes object Customer Data( can not be used together
        with destinationLocationCo'
      requestBody:
        content:
          application/json:
            example:
              orderId: '202111081227'
              ref1: 1234ABCDE
              pickupLocationCode: '12364'
              deliveryOptionId: '12364'
              storeName: Brand A English
              payment_method: paid
