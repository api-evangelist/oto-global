  /rest/v2/webhook:
    post:
      operationId: webhook
      summary: webhook
      tags:
      - Webhook
      description: 'This endpoint enables OTO to send update payloads to the specified URL using the defined
        method. Optional security measures, such as token authentication and payload validation, can be
        configured for enhanced security. Request Parameters: Name Required Type Description method yes
        string POST or PUT url yes string Your endpoint listens to get OTO webhook payload, when order
        status changes. exp. https://webhook.site/3e53c98a-a089-4ca4-9bc4-df10e5a71e4b secretKey no string
        With this key message is '
      requestBody:
        content:
          application/json:
            example:
              method: post
              url: https://webhook.site/3e53c98a-a089-4ca4-9bc4-df10e5a71e4b
              orderPrefix: fulfillment
              timestampFormat: '2025-01-01 13:14:34'
              secretKey: key1234
              authorizationKey: authorizationkey123
              webhookType: shipmentError
            schema:
              type: object
      responses:
        '200':
          description: 200 webhook-order status
          content:
            application/json:
              example:
                success: true
                id: '59'
                message: webhook has been created
    get:
      operationId: getWebhook
      summary: webhook
      tags:
      - Webhook
      description: 'This endpoint allows you to retrieve a list of all registered webhook definitions.
        It provides detailed information about each webhook, including its configuration and associated
        event triggers, enabling you to manage and review your webhook integrations effectively. Note:
        You can filter by id if you know the id of the webhook. Request Parameters: Name Required Type
        Description id no string id of the webhook'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                webhooks:
                - method: post
                  secretKey: secret123
                  authorizationKey: authorization123
                  timestampFormat: '2025-01-01 10:10:10'
                  id: 59
                  url: https://webhook.site/3e53c98a-a089-4ca4-9bc4-df10e5a71e4b
                  orderPrefix: fulfillment
                success: true
    put:
      operationId: putWebhook
      summary: webhook
      tags:
      - Webhook
      description: 'This API endpoint allows updating an already registered webhook by providing its unique
        ID. This ensures you can modify existing webhook configurations, such as URL, secretKey, or other
        parameters, without needing to delete and recreate it. Request Parameters: Name Required Type
        Description id yes string Id of the webhook record. method yes string POST or PUT url yes string
        Your endpoint listens to get OTO webhook payload, when order status changes. exp. https://webhook.site/3e53c98a-a089-4ca4-9'
      requestBody:
        content:
          application/json:
            example:
              id: 59
              method: post
              url: https://webhook.site/3e53c98a-a089-4ca4-9bc4-df10e5a71e4b
              orderPrefix: test-2
              timestampFormat: '2025-01-01 10:10:10'
              secretKey: secret123
              authorizationKey: authorizationkey123
              webhookType: orderStatus
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
                message: webhook has been updated
    delete:
      operationId: deleteWebhook
      summary: webhook
      tags:
      - Webhook
      description: 'This API endpoint enables the removal of a registered webhook from the system using
        its unique ID. This ensures you can effectively manage and clean up webhook configurations that
        are no longer needed. Request Parameters: Name Required Type Description id yes string Id of the
        webhook record.'
      responses:
        '200':
          description: webhook
          content:
            application/json:
              example:
                success: true
                message: webhook has been deleted
  /rest/v2/assignDriver:
    post:
      operationId: assignDriver
      summary: assignDriver
      tags:
      - OTO FLEX
      description: 'This API endpoint enables clients to assign a specific driver to their shipments for
        the OTO Flex app. This endpoint streamlines the allocation process, allowing businesses to efficiently
        manage driver assignments and ensure smooth delivery operations. Either valid driverID or driverEmail
        is required. Request Paramaters: Name Required Type Description orderIDs yes array An array of
        orderIDs objects containing the order ids driverID yes (If driverEmail isn''t present) long ID
        of the driver driverE'
      requestBody:
        content:
          application/json:
            example:
              orderIDs:
              - 3079460
              driverID: 8702
              driverEmail: test@driver.com
            schema:
              type: object
      responses:
        '200':
          description: 200 OK driverId
          content:
            application/json:
              example:
                '31071127':
                  success: true
                  otoId: 31071127
