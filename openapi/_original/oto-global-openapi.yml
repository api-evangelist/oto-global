  description: 'You need your refresh_token for authorization. You can obtain your token from the UI by
    following these steps: Go to Settings → API Integrations . Click the Connect button to activate your
    Refresh Token . The refresh_token can only be used to get a new access_token . Use the access_token
    to call oth'
