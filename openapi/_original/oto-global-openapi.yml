    post:
      operationId: createReturnShipment
      summary: Create Return Shipment
      tags:
      - Return Shipments
      description: 'This API endpoint creates a new return order for delivered forward orders. A new return
        order ID is generated by appending a suffix (e.g. -R1, -R2) to the original order ID and is returned
        in the response for return tracking and related operations. Return processing is handled on an
        item basis, meaning only the specified items are included in the return order and used for all
        return-related calculations. Example: Original order ID: ORD-1234 Order status: delivered Result:
        A new return order is c'
      requestBody:
        content:
          application/json:
            example:
              orderId: '202111080914'
              deliveryOptionId: '156'
              pickupLocationCode: wh1
              items:
              - quantity: '1'
                sku: SKU045857
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
                returnOrderId: 2204749035-R1
                message: A new return order is created for return shipment
