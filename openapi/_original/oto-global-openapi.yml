      description: 'This API endpoint enables you to track a shipment by providing the tracking number
        and delivery company name. Without requiring any authorization, it offers detailed shipment information,
        including tracking URL, real time status updates and status history. If you are a marketplace,
        you can track your sellers'' shipments without requiring additional authorization. Request Parameters:
        Name Required Type Description trackingNumber yes string The shipment/ tracking number that you
        wanna track. delive'
