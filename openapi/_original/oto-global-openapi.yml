  /rest/v2/holdOrder:
    post:
      operationId: holdOrder
      summary: Hold Order
      tags:
      - Orders
      description: 'This API endpoint allows you to place an order on hold, temporarily pausing its processing.
        This is useful for scenarios such as payment verification, inventory issues, or customer requests.
        Request Parameters: Name Required Type Description orderId yes string Id of the order that you
        will place on hold. onHoldReason yes string Reason for being an order on hold. onHoldReasonLang
        yes string Values can be: eng, tr, ar. onHoldComment no string Reason or note explaining why the
        order is placed on ho'
      requestBody:
        content:
          application/json:
            example:
              orderId: OID-20980-1146
              onHoldReason: Fraud
              onHoldReasonLang: en
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
        '400':
          description: 400 missing reason config lang
          content:
            application/json:
              example:
                success: false
                otoErrorCode: OTO110
                otoErrorMessage: On Hold reason is is missing or invalid
  /rest/v2/unHoldOrder:
    post:
      operationId: unHoldOrder
      summary: Unhold Order
      tags:
      - Orders
      description: 'This API endpoint allows users to release orders that are currently on hold. This
        endpoint is designed to resume the processing of held orders, making them available for fulfillment
        or further actions in the order management workflow. Request Parameters: Name Required Type Description
        orderId yes string The orderId you want to unhold.'
      requestBody:
        content:
          application/json:
            example:
              orderId: OID-9616-98794
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
        '409':
          description: 400 not allowed status
          content:
            application/json:
              example:
                success: false
                otoErrorCode: OTO1103
                otoErrorMessage: Status of the order is not suitable for the action
