  /rest/v2/orders/{orderId}/customer-notifications:
    get:
      operationId: customernotifications
      summary: Customer Notifications
      tags:
      - Customer Notifications
      description: 'This endpoint allows you to retrieve all system-generated customer communication artifacts
        related to a specific order. It enables you to fully control your customer communication by consuming
        these artifacts and sending them through your own CRM, ERP, or communication platforms. The API
        endpoint provides the below customer notifications if generated and still valid. You can configure
        the actionTypes: Tracking Link Feedback (Rating) Link Undelivered Attempt Link Delivery Slot Selection
        Link Addr'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                orderId: '123456'
                actions:
                - type: trackingLink
                  value: https://tracking-link...
                - type: feedbackLink
                  value: https://feedback-link...
                - type: clickCollectOTP
                  channel: OTP
                  value: '458921'
  /rest/v2/getDeliveryEstimation:
    post:
      operationId: getDeliveryEstimation
      summary: Get Delivery Estimation
      tags:
      - Carrier Integrations
      description: This API endpoint allows you to access estimated delivery dates, times, and other last-mile
        process details by utilizing the SLA configurations of your shipping partners. By providing key
        information such as the pickup and customer addresses, you can retrieve precise delivery and pickup
        date estimates. This capability enhances the accuracy of your shipping operations and proves invaluable
        for businesses and logistics providers aiming to streamline workflows and deliver reliable delivery
        timeline
      requestBody:
        content:
          application/json:
            example:
              calculationData:
                originAddress:
                  city: Riyadh
                  country: SA
                  lat: 45
                  lon: 45
                  district: ''
                destinationAddress:
                  city: Riyadh
                  country: SA
                  lat: 45
                  lon: 45
                  district: ''
              deliveryCompanySettingsId: 1233
              slaMethodType: CITY_BASED
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                result:
                - estimatedTransferDuration: 3
                  shippingContract:
                    agreementType: INTEGRATOR
                    deliveryCompanySettingsId: 1233
                    name: Smsa Ecom V2
                    id: 117
                    slaMethodType: TIER_BASED
                    deliveryIntegrationName: secom
                  estimatedPickupDate: '2024-01-15'
                  cutOffSameDayPickup: '15:00'
                  estimatedTransferCompletionDate: '2024-01-18'
                  estimatedDeliveryDate: '2024-01-18'
                  shipmentCreateDate: '2024-01-10'
                success: true
