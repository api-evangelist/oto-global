  /rest/v2/checkCoverage:
    post:
      operationId: checkCoverage
      summary: Check Coverage
      tags:
      - Carrier Integrations
      description: 'This API endpoint allows you to verify whether the location provided in your request is within the coverage area defined by your OTO settings, including the coverage configurations for delivery companies and the branches. Request Parameters: Name Required Type Description city yes string City to check coverage lat yes long Latitude lon yes long Longitude pickupLocation no boolean If you pass true, it will list the covered and available pickup locations. pickupLocationCode no string Lists only th'
      requestBody:
        content:
          application/json:
            example:
              lat: '24.28738403'
              lon: '46.44305038'
              city: Riyadh
            schema:
              type: object
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              example:
                branchCoverage: true
                courierDelivery: true
                success: true
                bulletDelivery: true
        '401':
          description: '401'
          content:
            application/json:
              example:
                message: Jwt is expired
                code: 401
        '400':
          description: 400 Bad Request
          content:
            application/json:
              example:
                success: false
                otoErrorCode: OTO1098
                otoErrorMessage: Lat and Lon is missing or invalid
  /rest/v2/availableCities:
    post:
      operationId: availableCities
      summary: Available Cities
      tags:
      - Carrier Integrations
      description: 'This API endpoint retrieves a list of cities available for delivery based on your coverage settings for active delivery companies you have contracts with. To obtain results, ensure that the delivery companies'' coverage areas are configured by adding cities through the OTO UI. Request Parameters: Name Required Type Description page no number Number of page, default is 1 limit no number Number of cities in a single page, default is 100'
      requestBody:
        content:
          application/json:
            example:
              limit: 3
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
                limit: 3
                page: 1
                orders:
                - city: Riyadh
                  city_ar: الرياض
                - city: Dammam
                  city_ar: الدمام
                - city: Jeddah
                  city_ar: جدة
  /rest/v2/availableTimeslots:
    post:
      operationId: availableTimeslots
      summary: Available Time Slots
      tags:
      - Carrier Integrations
      description: 'This API endpoint retrieves the available delivery time slots for delivery companies based on their specified working hours. Request Parameters: Name Required Type Description lat no string Latitude lon no string Longitude serviceType yes string Possible values: bullet , courier packageSize no string'
      requestBody:
        content:
          application/json:
            example:
              serviceType: bullet
              packageSize: simCard
              lat: '24.00'
              lon: '46.00'
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
