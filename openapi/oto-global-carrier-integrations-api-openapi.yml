openapi: 3.0.3
info:
  title: OTO API V2 Account Carrier Integrations API
  version: 2.0.0
  description: 'Introduction OTO REST API provides seamless integration for managing shipments, tracking deliveries, and handling logistics operations. With powerful endpoints for creating, updating, and querying shipments, it ensures efficient and reliable communication between your systems and OTO''s platform. Overview We continuously analyze the e-commerce and logistics industries to enhance shipping and fulfillment processes, making them easier for vendors. OTO APIs are designed to automate and simplify key logistics operations, including: 🚀 Order Management – Process, update, and sync orders seamlessly. 🚀 Shipment Management – Create, manage, and track shipments effortlessly. 🚀 Return Management – Handle return requests and reverse logistics smoothly. 🚀 Stock Inventory Management – Keep inventory levels updated in real-time. 🚀 Product Management – Organize, update, and synchronize products efficiently. 🚀 Warehouse Management – Add, update, organize pickup locations. You can find guidance to assist you throughout the integration process here . Base URL: All API requests must be made over HTTPS to the following base endpoint: https://api.tryoto.com Meet our new OTO AI Assistant 🤖— a smart AI agent designed to help you navigate and use our REST API with ease. Whether you''re integrating for the first time or need help troubleshooting a request, our assistant is here to provide instant answers, example json responses, guide you through endpoints, and help you build faster.'
  contact:
    name: OTO Support
    url: https://help.tryoto.com/en/support/home
  x-source: derived from published OTO API V2 Postman collection (apis.tryoto.com)
servers:
- url: https://api.tryoto.com/rest/v2
  description: Production
- url: https://staging-api.tryoto.com/rest/v2
  description: Staging / sandbox
security:
- bearerAuth: []
tags:
- name: Carrier Integrations
  description: ''
paths:
  /rest/v2/getDeliveryEstimation:
    post:
      operationId: getDeliveryEstimation
      summary: Get Delivery Estimation
      tags:
      - Carrier Integrations
      description: This API endpoint allows you to access estimated delivery dates, times, and other last-mile process details by utilizing the SLA configurations of your shipping partners. By providing key information such as the pickup and customer addresses, you can retrieve precise delivery and pickup date estimates. This capability enhances the accuracy of your shipping operations and proves invaluable for businesses and logistics providers aiming to streamline workflows and deliver reliable delivery timeline
      requestBody:
        content:
          application/json:
            example:
              calculationData:
                originAddress:
                  city: Riyadh
                  country: SA
                  lat: 45
                  lon: 45
                  district: ''
                destinationAddress:
                  city: Riyadh
                  country: SA
                  lat: 45
                  lon: 45
                  district: ''
              deliveryCompanySettingsId: 1233
              slaMethodType: CITY_BASED
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                result:
                - estimatedTransferDuration: 3
                  shippingContract:
                    agreementType: INTEGRATOR
                    deliveryCompanySettingsId: 1233
                    name: Smsa Ecom V2
                    id: 117
                    slaMethodType: TIER_BASED
                    deliveryIntegrationName: secom
                  estimatedPickupDate: '2024-01-15'
                  cutOffSameDayPickup: '15:00'
                  estimatedTransferCompletionDate: '2024-01-18'
                  estimatedDeliveryDate: '2024-01-18'
                  shipmentCreateDate: '2024-01-10'
                success: true
  /rest/v2/aiEstimatedDeliveryDates:
    post:
      operationId: aiEstimatedDeliveryDates
      summary: AI Estimated Delivery Dates
      tags:
      - Carrier Integrations
      description: 'This API endpoint allows you retrieve OTO’s AI-generated estimated pickup and delivery dates . The endpoint is designed solely for prediction purposes —it does not create or update any shipments. The prediction model uses all up-to-date operational data within OTO , including historical delivery patterns, courier performance, service types, regions, and peak-time behavior. Based on this data, it produces a reliable estimate for both pickup and delivery timelines. Request Parameters: Name Require'
      requestBody:
        content:
          application/json:
            example:
              weight: '1'
              originCity: Riyadh
              destinationCity: Riyadh
              height: 15
              width: 10
              length: 10
              includeEstimatedDates: true
            schema:
              type: object
      responses:
        '200':
          description: '200'
