  /rest/v2/dcConfig:
    post:
      operationId: dcConfig
      summary: DC Config
      tags:
      - Carrier Integrations
      description: 'This API endpoint allows you to view the required account credentials and the template for the delivery company specified in the request, which are needed for the next step: DC activation. Retrieve the delivery company configuration template. Use this template to create a valid configuration object, similar to the given exampleJson . This configuration object is then used to activate the delivery company with the DC Activation API endpoint. Request Parameters: Name Required Type Description code'
      requestBody:
        content:
          application/json:
            example:
              code: aramex
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                settings:
                - fieldName: UserName
                  parentJson: ClientInfo
                  fieldType: string
                - fieldName: Password
                  parentJson: ClientInfo
                  fieldType: string
                - fieldName: Version
                  parentJson: ClientInfo
                  fieldType: string
                - fieldName: AccountNumber
                  parentJson: ClientInfo
                  fieldType: string
                - fieldName: AccountPin
                  parentJson: ClientInfo
                  fieldType: string
                - fieldName: AccountEntity
                  parentJson: ClientInfo
                  fieldType: string
                - fieldName: AccountCountryCode
                  parentJson: ClientInfo
                  fieldType: string
                - fieldName: Source
                  parentJson: ClientInfo
                  fieldType: string
                - fieldName: productType
                  fieldType: enum
                  enumValues: EPX,CDS,OND,GPX,GDX,DPX,DDX,PLX,PPX,PDX
                success: true
                exampleJSON:
                  delivery_fee: 0
                  rating: 0
                  ClientInfo:
                    UserName: ''
                    Version: v1
                    AccountPin: ''
                    AccountCountryCode: SA
                    AccountEntity: RUH
                    Source: 24
                    Password: ''
                    AccountNumber: ''
                  productType: CDS
  /rest/v2/dcActivation:
    post:
      operationId: dcActivation
      summary: DC Activation
      tags:
      - Carrier Integrations
      description: 'This API endpoint is used to perform Delivery Company (DC) activation. It enables you to activate a delivery company by providing the required configuration details. Request Parameters: Name Required Type Description code yes string The integration name obtained from the DC List. deliveryOptionName yes string A name you assign to easily identify this configuration. brandID no number id of the brand created by Create Brand endpoint settings yes object A configuration object created based on the e'
      requestBody:
        content:
          application/json:
            example:
              code: aramex
              deliveryOptionName: api test aramex
              settings:
                ClientInfo:
                  UserName: apitest@example.com
                  Version: v1
                  AccountPin: '123'
                  AccountCountryCode: SA
                  AccountEntity: RUH
                  Source: 24
                  Password: 123abc
                  AccountNumber: '123456'
                productType: CDS
            schema:
              type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                success: true
                deliveryOptionId: '123'
